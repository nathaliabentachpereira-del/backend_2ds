<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            font-size: 8rem;
            font-weight: 800;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #212529;
        }

        p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #007bff;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #e2e6ea;
            color: #495057;
        }

        .btn-secondary:hover {
            background-color: #dae0e5;
        }

        @media (max-width: 480px) {
            h1 { font-size: 6rem; }
            h2 { font-size: 1.5rem; }
            .links-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Ops! Página não encontrada</h2>
        <p>O link que você acessou pode estar quebrado ou a página foi removida permanentemente.</p>
        
        <div class="links-container">
            <a href="/" class="btn btn-primary">Página Inicial</a>
            <a href="/sobre" class="btn btn-secondary">Sobre Nós</a>
        </div>
    </div>

</body>
</html>
